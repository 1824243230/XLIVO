common:
  img_topic: "/camera/image_raw"
  lid_topic: "/lidar/points"
  imu_topic: "/imu/data"
  # Standard LiDAR + IMU + vision mode. This requires imu/imu_en=true.
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false



extrin_calib:
  # LIDAR_FRONT -> IMU. Translation retained from the supplied configuration.
  # Coarse axis alignment inferred from this bag's LiDAR/IMU motion and replay:
  # p_imu = [z_lidar, y_lidar, -x_lidar] + T (forward/right/down IMU axes).
  # For metric evaluation, replace this axis alignment with measured mounting calibration.
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [0, 0, 1,
                0, 1, 0,
               -1, 0, 0]
  # LIDAR_FRONT -> CAM_FRONT_MID optical frame: p_cam = Rcl * p_lidar + Pcl.
  # The bag must contain LIDAR_FRONT points; renaming lidar_right is insufficient.
  Rcl: [-0.027681630046,  0.999592934644,  0.006905966152,
        -0.980288363146, -0.025793731239, -0.195881108096,
        -0.195623241048, -0.012192146622,  0.980603334240]

  Pcl: [-0.053559380973,0.029191204736,-0.092758169475]


time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.0
  lidar_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.2
  lidar_type: 8 # LG PointCloud2: x/y/z/intensity/timestampOffset
  # timestampOffset ~0..100000 for a ~0.1 s scan in hbus_ros1.bag.
  # Interpreted as microseconds; convert to the internal millisecond unit.
  timestamp_offset_scale: 0.001
  feature_extract_enabled: false
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  # Required by the standard LiDAR-inertial-visual synchronization path.
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "hbus_lg"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
